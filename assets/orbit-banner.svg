<!-- 02: ABOUT -->
<h2>02 / BEHIND THE SYSTEM</h2>

I'm **Satya Sai**, a Data Analyst and GenAI / Agentic AI Engineer interested in building intelligent, data-driven solutions.

I work across the complete journey of data — from extraction, transformation and SQL optimization to business intelligence, enterprise knowledge retrieval and AI-powered automation.

My focus is on building practical systems that make information more accessible, workflows more efficient and decisions more informed.

**What I bring to the table:**

- **Data Engineering:** Python ETL pipelines, data processing and integrity.
- **Analytics:** SQL optimization, data analysis and reporting.
- **Business Intelligence:** Interactive Power BI and Tableau dashboards.
- **Generative AI:** Retrieval-Augmented Generation and LangChain.
- **Agentic AI:** AutoGen and multi-agent automation architectures.
- **Computer Vision:** Python, OpenCV and TensorFlow.

