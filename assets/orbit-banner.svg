<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="1" stop-color="#0D1326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.35" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="outer" d="M70,160 a430,120 0 1,0 860,0 a430,120 0 1,0 -860,0"/>
    <path id="inner" d="M170,160 a330,80 0 1,0 660,0 a330,80 0 1,0 -660,0"/>
  </defs>

  <!-- Background and halo -->
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="500" cy="160" r="200" fill="url(#halo)">
    <animate attributeName="r" values="190;210;190" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Tilted orbit system for 3D perspective -->
  <g transform="rotate(-8 500 160)">
    <ellipse cx="500" cy="160" rx="430" ry="120" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 8"/>
    <ellipse cx="500" cy="160" rx="330" ry="80" fill="none" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Central glowing core -->
    <circle cx="500" cy="160" r="34" fill="url(#core)" opacity="0.45" filter="url(#glow)">
      <animate attributeName="r" values="32;38;32" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer orbit tags -->
    <g>
      <animateMotion dur="26s" repeatCount="indefinite" begin="0s"><mpath href="#outer"/></animateMotion>
      <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#0D1326" stroke="#00E5FF" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">PYTHON</text>
    </g>
    <g>
      <animateMotion dur="26s" repeatCount="indefinite" begin="-6.5s"><mpath href="#outer"/></animateMotion>
      <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#0D1326" stroke="#3B82F6" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">SQL</text>
    </g>
    <g>
      <animateMotion dur="26s" repeatCount="indefinite" begin="-13s"><mpath href="#outer"/></animateMotion>
      <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#0D1326" stroke="#A855F7" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">POWER BI</text>
    </g>
    <g>
      <animateMotion dur="26s" repeatCount="indefinite" begin="-19.5s"><mpath href="#outer"/></animateMotion>
      <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#0D1326" stroke="#6366F1" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">TABLEAU</text>
    </g>

    <!-- Inner orbit tags -->
    <g>
      <animateMotion dur="20s" repeatCount="indefinite" begin="0s"><mpath href="#inner"/></animateMotion>
      <rect x="-42" y="-13" width="84" height="26" rx="13" fill="#0D1326" stroke="#22D3EE" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">RAG</text>
    </g>
    <g>
      <animateMotion dur="20s" repeatCount="indefinite" begin="-6.67s"><mpath href="#inner"/></animateMotion>
      <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#0D1326" stroke="#00E5FF" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">LANGCHAIN</text>
    </g>
    <g>
      <animateMotion dur="20s" repeatCount="indefinite" begin="-13.33s"><mpath href="#inner"/></animateMotion>
      <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#0D1326" stroke="#A855F7" stroke-opacity="0.8"/>
      <text y="4" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#F8FAFC" letter-spacing="1">AUTOGEN</text>
    </g>

    <!-- Glowing particles travelling the orbits -->
    <circle r="2.5" fill="#00E5FF" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" begin="0s"><mpath href="#outer"/></animateMotion>
    </circle>
    <circle r="2" fill="#A855F7" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" begin="-4.6s"><mpath href="#outer"/></animateMotion>
    </circle>
    <circle r="2" fill="#00E5FF" filter="url(#glow)">
      <animateMotion dur="11s" repeatCount="indefinite" begin="-2s"><mpath href="#inner"/></animateMotion>
    </circle>
    <circle r="2" fill="#A855F7" filter="url(#glow)">
      <animateMotion dur="11s" repeatCount="indefinite" begin="-7.3s"><mpath href="#inner"/></animateMotion>
    </circle>
  </g>

  <!-- Name and title (drawn above the orbit system) -->
  <text x="500" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#accent)" filter="url(#glow)">
    SAI KUMAR
  </text>
  <text x="500" y="196" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#00E5FF" letter-spacing="3">DATA ANALYST | GENAI AND AGENTIC AI ENGINEER</text>
  <text x="500" y="222" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#94A3B8" letter-spacing="2">HYDERABAD, INDIA</text>

  <!-- Thin accent line that pulses -->
  <line x1="380" y1="236" x2="620" y2="236" stroke="url(#accent)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
