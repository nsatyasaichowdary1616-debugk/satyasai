<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="floor" d="M0,40 L1000,40"/>
  </defs>

  <rect width="1000" height="120" rx="20" fill="#080B16"/>

  <!-- Glowing horizontal line -->
  <rect x="80" y="39" width="840" height="2" fill="url(#fline)" filter="url(#fglow)"/>

  <!-- Particles drifting along the line -->
  <circle r="2" fill="#00E5FF" filter="url(#fglow)">
    <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#floor"/></animateMotion>
  </circle>
  <circle r="2" fill="#A855F7" filter="url(#fglow)">
    <animateMotion dur="9s" repeatCount="indefinite" begin="-4.5s"><mpath href="#floor"/></animateMotion>
  </circle>

  <text x="500" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#F8FAFC">Building intelligent systems. Turning data into decisions.</text>
  <text x="500" y="102" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#94A3B8" letter-spacing="2">SAI KUMAR · HYDERABAD, INDIA</text>
</svg>
